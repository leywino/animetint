name: animetint
description: "Bring cinematic \"Reading Mode\" vibes from tablets to Android — warm tints & grain for anime/manga"
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_background: ^1.3.0+1
  flutter_overlay_window:
    path: packages/flutter_overlay_window
  fluttertoast: ^10.0.2
  material_ui: ^1.11.1
  permission_handler: ^13.0.2
  provider: ^6.1.5
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  change_app_package_name: ^1.5.0

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "kanji.png"

flutter:
  uses-material-design: true
